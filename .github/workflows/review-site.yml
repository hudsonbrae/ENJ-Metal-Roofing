# Publishes the review build to GitHub Pages on every push to main
# (including merged pull requests), for hands-on testing while the site is
# in development. The review build shows development fixtures and
# "Awaiting ENJ" markers, is noindexed, and its robots.txt blocks crawlers.
# The quote form validates but sends nothing on this static site.
#
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
name: Review site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: review-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build review site
        run: npx astro build --mode review
        env:
          DEPLOY_TARGET: github-pages

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
