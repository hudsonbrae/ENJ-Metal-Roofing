# Publishes the site to GitHub Pages on every push to main (including merged
# pull requests), for hands-on testing. It is the launch build: ENJ signed off
# the content, so no review markers show. It is noindexed and its robots.txt
# blocks crawlers, so only ENJ's own domain is indexed. The quote form
# validates but sends nothing on this static site.
#
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
name: Review site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: review-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        run: npx astro build
        env:
          DEPLOY_TARGET: github-pages

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
