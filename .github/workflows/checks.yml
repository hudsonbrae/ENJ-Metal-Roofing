# Runs on every pull request and every push to main:
#   1. the launch build, which fails if review-only content would ship
#   2. the Playwright suite against the review build (pages, overflow at
#      seven widths, axe accessibility, hero fold, menu, quote form, gallery)
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Launch build and review-content guard
        run: npm run build

      - run: npx playwright install --with-deps chromium

      - name: Review build and end-to-end tests
        run: npm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
